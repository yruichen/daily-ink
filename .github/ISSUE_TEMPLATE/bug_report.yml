name: Bug report
description: Report a reproducible problem in Daily Ink
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Daily Ink. Remove journal content, API keys, and other personal data before submitting.

  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets and personal writing from this report.
          required: true

  - type: textarea
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true

  - type: input
    attributes:
      label: Daily Ink version
      description: Release version or commit SHA
      placeholder: v0.1.0
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Installation
      options:
        - npm development
        - npm production build
        - Docker
        - Other
    validations:
      required: true

  - type: input
    attributes:
      label: Environment
      description: Operating system, browser, and Node.js version
      placeholder: macOS 15, Chrome 134, Node.js 22
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional context
      description: Sanitized logs or screenshots that help explain the issue
